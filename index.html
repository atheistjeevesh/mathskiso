<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kiso Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared/kiso.css">
<style>
  .hub { height: 100vh; height: 100dvh; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); gap: 10px; }
  .chs { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 10px; }
  .ch { display: grid; grid-template-rows: minmax(0, 1fr) auto; text-decoration: none; color: var(--ink); background: var(--panel); border: 2px solid var(--ink); outline: 2px solid var(--page-ink); padding: 8px; min-height: 0; overflow: hidden; transition: transform .12s; }
  .ch:hover { transform: translateY(-3px) rotate(-.5deg); background: var(--paper); }
  .ch:active { transform: translate(2px, 2px); }
  .ch .pic { position: relative; min-height: 0; border: 2px solid var(--ink); overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 26px 6px 0 10px; }
  .ch .pic .big { font: 800 clamp(18px, 3.4vw, 42px)/1.05 var(--font-display); letter-spacing: -0.03em; color: var(--ink); text-align: left; min-width: 0; overflow-wrap: anywhere; }
  .ch .pic img { flex: none; align-self: flex-end; height: 92%; max-width: 46%; object-fit: contain; }
  .ch .pic .n { position: absolute; left: 0; top: 0; background: var(--ink); color: var(--panel); font: 800 16px/1 var(--font-display); padding: 5px 8px; }
  .ch .k { font: 700 11px/14px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin-top: 6px; }
  .ch b { display: block; font: 800 clamp(15px, 2.2vw, 22px)/1.05 var(--font-display); letter-spacing: -0.02em; }
  .ch .bar2 { height: 8px; border: 2px solid var(--ink); margin-top: 6px; position: relative; background: var(--paper); }
  .ch .bar2 i { position: absolute; inset: 0; background: var(--beni); transform-origin: left; }
  .how { background: var(--panel); color: var(--ink); border: 2px solid var(--ink); outline: 2px solid var(--page-ink); padding: 10px; display: grid; gap: 6px; align-content: center; }
  .how b { font: 800 18px/1.1 var(--font-display); }
  .how ul { margin: 0; padding-left: 18px; font: 600 13px/18px var(--font-sans); }
  .how { grid-column: span 1; } .how ul li:nth-child(n+3) { display: none; }
  .mhead h1 { font-size: clamp(22px, 3.6vw, 40px); } .mhead p { font-size: 14px; }
  .ch .k { font-size: 10px; line-height: 12px; margin-top: 4px; } .ch .cn { display: none; }
  .ch .pic .big { font-size: clamp(14px, 1.7vw, 24px); overflow: hidden; }
  .ch .pic img { max-width: 36%; }
  .ch .pic .big { font-size: clamp(16px, 2.1vw, 30px); white-space: nowrap; }
  .ch { min-width: 0; grid-template-columns: minmax(0, 1fr); }
  .ch b { font-size: clamp(14px, 1.6vw, 20px); }
  .ch b .f { display: none; } .ch b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: clamp(13px, 1.45vw, 18px); }
  @media (max-width: 700px) {
    .chs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .ch { padding: 6px 8px; grid-template-rows: 1fr; align-content: center; background: var(--bg); }
    .ch .pic, .ch .k, .how { display: none; }
    .ch b { font-size: 13.5px; white-space: normal; line-height: 1.15; margin-top: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ch b .s { display: inline; } .ch b .f { display: none; }
    .ch .cn { display: inline-block; background: var(--ink); color: var(--panel); font: 800 11px/1 var(--font-display); padding: 3px 5px; margin-right: 6px; vertical-align: 2px; }
    .ch .bar2 { height: 6px; margin-top: 5px; }
    .mhead p { display: none; }
  }
  @media (max-height: 560px) { .how { display: none; } }
  @media (min-width: 701px) and (max-height: 860px) { .ch { background: var(--bg); grid-template-rows: 1fr; align-content: center; padding: 10px 12px; } .ch .pic { display: none; } .ch .cn { display: inline-block; background: var(--ink); color: var(--panel); font: 800 12px/1 var(--font-display); padding: 4px 6px; margin-right: 8px; vertical-align: 3px; } .ch .k { margin: 0 0 6px; } .ch b { font-size: clamp(14px, 1.45vw, 18px); white-space: normal; line-height: 1.15; } .ch .bar2 { margin-top: 8px; } .ch { display: flex; flex-direction: column; justify-content: center; } .ch b .f { display: inline; } .ch b .s { display: none; } .ch .k { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } }
  @media (min-width: 701px) and (max-height: 680px) { .ch b .f { display: none; } .ch b .s { display: inline; } .ch { padding: 6px 10px; } }
  .how { overflow: hidden; } .how ul { font-size: 12px; line-height: 16px; }
  @media (max-height: 700px) { .how ul li:nth-child(n+2) { display: none; } }
</style>
</head>
<body>
<div class="hub">
  <header class="mhead">
    <div>
      <div class="eyebrow">Kiso · NCERT Class 11 &amp; 12 Mathematics</div>
      <h1>Learn it by <em>playing</em> it.</h1>
      <p>All of Class 11 and Class 12 Part 1 with Jeevesh and Kimmy. Every concept is a simulation and every textbook question is a tactile sim with speed points.</p>
    </div>
    <div class="art" aria-hidden="true"><div><img src="m/jess-body.png" alt="" width="29" height="76"></div><div><img src="m/kimmy-sit.png" alt="" width="61" height="76"></div></div>
  </header>
  <div class="mtools"><span class="prog" id="tot"></span><span class="xp" id="xp"></span><button class="pill snd" type="button" id="snd">🔇 Sound</button></div>
  <nav class="chs" id="chs" aria-label="Chapters"></nav>
</div>
<script>
const CHS = [
  { n: 1, t: 'Sets', big: '{ A ∪ B }', img: 'kimmy-curious', k: 'Venn · subsets · intervals' },
  { n: 2, t: 'Relations & Functions', s: 'Relations & Funcs', big: 'f : A → B', img: 'kimmy-playful', k: 'Grids · arrows · graphs' },
  { n: 3, t: 'Trigonometric Functions', s: 'Trig Functions', big: 'sin²+cos²', img: 'kimmy-lookup', k: 'Unit circle · identities' },
  { n: 4, t: 'Complex Numbers', big: 'i² = −1', img: 'kimmy-surprised', k: 'Argand plane · rotations' },
  { n: 5, t: 'Linear Inequalities', big: 'x < 3', img: 'kimmy-excited', k: 'Balance · number line' },
  { n: 6, t: 'Permutations & Combinations', s: 'Perms & Combos', big: 'ⁿPᵣ · ⁿCᵣ', img: 'jess-thinking', k: 'Slots · trees · tiles' },
  { n: 7, t: 'Binomial Theorem', big: '(a + b)ⁿ', img: 'kimmy-content', k: 'Pascal · expansions' },
  { n: 8, t: 'Sequences & Series', big: 'a, ar, ar²', img: 'jess-happy', k: 'G.P. · sums · A.M. ≥ G.M.' },
  { n: 9, t: 'Straight Lines', big: 'y = mx + c', img: 'kimmy-walk', k: 'Slopes · forms · distance' },
  { n: 10, t: 'Conic Sections', big: 'e = c/a', img: 'jess-excited', k: 'Cone slicer · foci' },
  { n: 11, t: 'Introduction to 3D Geometry', s: '3D Geometry', big: '(x, y, z)', img: 'kimmy-lookup', k: 'Orbit · octants · distance' },
  { n: 12, t: 'Limits & Derivatives', s: 'Limits & Derivs', big: 'lim f(x)', img: 'jess-thinking', k: 'Secants · tangents' },
  { n: 13, t: 'Statistics', big: 'x̄ ± σ', img: 'kimmy-content', k: 'Dot plots · spread' },
  { n: 14, t: 'Probability', big: 'P(A ∪ B)', img: 'jess-happy', k: 'Dice grid · Venn · decks' },
  { n: '12-1', file: 'c12ch1', b: 'XII · 1', t: 'Relations & Functions', s: 'Relations & Funcs', big: 'R, S, T', img: 'kimmy-surprised', k: 'Class 12 · bijections' },
  { n: '12-2', file: 'c12ch2', b: 'XII · 2', t: 'Inverse Trigonometric Functions', s: 'Inverse Trig', big: 'sin⁻¹ x', img: 'jess-thinking', k: 'Class 12 · principal values' },
  { n: '12-3', file: 'c12ch3', b: 'XII · 3', t: 'Matrices', big: '[aᵢⱼ]', img: 'kimmy-playful', k: 'Class 12 · row × column' },
  { n: '12-4', file: 'c12ch4', b: 'XII · 4', t: 'Determinants', big: '|A|', img: 'jess-happy', k: 'Class 12 · area · inverse' },
  { n: '12-5', file: 'c12ch5', b: 'XII · 5', t: 'Continuity & Differentiability', s: 'Continuity & Diff.', big: 'dy/dx', img: 'kimmy-lookup', k: 'Class 12 · pen-lift · chain' },
  { n: '12-6', file: 'c12ch6', b: 'XII · 6', t: 'Application of Derivatives', s: 'Applications of f′', big: "f′(x) = 0", img: 'jess-excited', k: 'Class 12 · rates · optimise' },
];
const BG = ['--sakura', '--sora-tint', '--peach', '--matcha-tint', '--kin-tint', '--sora-tint', '--peach', '--matcha-tint', '--sakura', '--kin-tint', '--matcha-tint', '--sakura', '--sora-tint', '--peach', '--kin-tint', '--sakura', '--matcha-tint', '--sora-tint', '--peach', '--kin-tint'];
const get = (k, d) => { try { const v = localStorage.getItem('kisoM:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const set = (k, v) => { try { localStorage.setItem('kisoM:' + k, JSON.stringify(v)); } catch (e) { } };
const prog = get('chapters', {}); let pts = 0, cleared = 0;
const box = document.getElementById('chs');
CHS.forEach((c, i) => {
  const p = prog[c.n] || {}; pts += p.pts || 0; if (p.total && p.done >= p.total) cleared++;
  const a = document.createElement('a'); a.className = 'ch'; a.href = (c.file || 'ch' + c.n) + '.html';
  a.style.setProperty('--bg', `var(${BG[i]})`);
  a.innerHTML = `<div class="pic" style="background:var(${BG[i]})"><span class="n">${c.b || 'CH ' + c.n}</span><div class="big">${c.big}</div><img src="m/${c.img}.png" alt=""></div>
    <div><div class="k">${c.k}${p.total ? ' · ' + p.done + '/' + p.total : ''}</div><b><span class="cn">${c.b || 'CH ' + c.n}</span><span class="f">${c.t}</span><span class="s">${c.s || c.t}</span></b><div class="bar2"><i style="transform:scaleX(${p.total ? p.done / p.total : 0})"></i></div></div>`;
  box.append(a);
});
const how = document.createElement('div'); how.className = 'how';
how.innerHTML = '<b>How it works</b><ul><li>Lessons: predict, play the sim, discover the rule.</li><li>Exercises: every NCERT question, broken into small steps.</li><li>Speed points, streaks and combo bursts like Kahoot.</li><li>Tap the progress bar to jump to any question.</li></ul>';

document.getElementById('tot').textContent = cleared + ' of ' + CHS.length + ' chapters cleared';
document.getElementById('xp').textContent = pts ? '★ ' + pts.toLocaleString() + ' pts' : '';
const sb = document.getElementById('snd'); let muted = get('muted', true);
const paint = () => { sb.textContent = muted ? '🔇 Sound' : '🔊 Sound'; sb.setAttribute('aria-pressed', !muted); };
paint(); sb.onclick = () => { muted = !muted; set('muted', muted); paint(); };
</script>
</body>
</html>
